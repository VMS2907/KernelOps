name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit, crash-exploration, real-crash and API tests
        run: python -m unittest discover -s tests -t . -v
      - name: Exhaustive crash exploration (all engines, all scenarios, power-loss model)
        run: python -m safewrite explore --models power
      - name: Real kill -9 torture (short)
        run: python -m safewrite torture --engines shadow,undo,wal,cow --trials 20 --size 16384
